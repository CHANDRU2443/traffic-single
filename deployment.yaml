apiVersion: apps/v1
kind: Deployment
metadata:
  name: industrial-monitor
  labels:
    app: industrial-monitor
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: industrial-monitor
  template:
    metadata:
      labels:
        app: industrial-monitor
    spec:
      containers:
      - name: dashboard
        image: DOCKERHUB_USERNAME/industrial-monitor:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: industrial-monitor-svc
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 32001
  selector:
    app: industrial-monitor
